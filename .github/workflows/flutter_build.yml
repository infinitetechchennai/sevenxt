name: Build Flutter APK

on:
  workflow_dispatch: # Run manually from GitHub Actions tab anytime

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # Flutter requires Java for Android builds
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'latest' # Uses a stable Flutter version
          channel: 'stable'
          
      - name: Install dependencies
        working-directory: ./sevenxt
        run: flutter pub get
        
      - name: Build APK
        working-directory: ./sevenxt
        run: flutter build apk --release
        
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sevenxt-release-apk
          path: sevenxt/build/app/outputs/flutter-apk/app-release.apk
