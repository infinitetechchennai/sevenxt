services:
  - type: web
    name: sevenxt-backend
    env: python
    region: singapore # Adjust as needed
    plan: free # Change to starter/pro if in production
    rootDir: app/backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        sync: false # Requires manual entry in dashboard
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: DELHIVERY_TOKEN
        sync: false
      - key: DELHIVERY_PICKUP_PIN
        sync: false
